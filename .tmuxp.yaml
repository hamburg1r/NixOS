session_name: NixOS
start_directory: ./
windows:
  - window_name: chat
    panes:
      - shell_command: opencode
  - window_name: editor
    layout: main-horizontal
    options:
      main-pane-height: "70%"
    panes:
      - shell_command: nvim
  - window_name: system
    layout: main-horizontal
    options:
      main-pane-height: "30%"
    panes:
      - shell_command:
        - cmd: nix flake update
          enter: false
      - shell_command:
        - cmd: nh home switch
          enter: false
      - shell_command:
        - cmd: nh os switch
          enter: false
